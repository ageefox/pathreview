name: Contribution checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "rag/generator/prompt_templates.py"
      - "tests/unit/test_prompt_templates.py"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "rag/generator/prompt_templates.py"
      - "tests/unit/test_prompt_templates.py"
      - ".github/workflows/ci.yml"

jobs:
  prompt-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pytest structlog
      - run: python -m pytest tests/unit/test_prompt_templates.py -q
